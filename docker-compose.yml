services:
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
volumes:
  mongodata:

  # ----------------------------------------------------
  # Jaeger — Distributed Tracing (OpenTelemetry)
  # Acesse a UI em: http://localhost:16686
  # ----------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: czanix_jaeger
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
